name: KineticScout CI

on:
  push:
    branches: [main]
    paths: ['kineticscout/**', '.github/workflows/kineticscout-ci.yml']
  pull_request:
    paths: ['kineticscout/**', '.github/workflows/kineticscout-ci.yml']

permissions:
  contents: read

concurrency:
  group: kineticscout-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: kineticscout

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history for committed secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source .. --redact --verbose --exit-code 1

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kinetic
          POSTGRES_PASSWORD: kinetic_ci_only
          POSTGRES_DB: kineticscout_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kinetic" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://kinetic:kinetic_ci_only@localhost:5432/kineticscout_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kineticscout/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:integration
      - name: Production build
        env:
          APP_URL: https://ci.invalid
        run: npx next build
