name: Deploy to GitHub Pages

# Publishes frontend/ as a static site to GitHub Pages. This is
# deliberately scoped to this branch only — the repo also has a
# completely separate static site on `main` (its own history, its own
# deploy story) that this workflow does not touch, build from, or
# interact with in any way.
on:
  push:
    branches: [claude/productized-service-multi-agent-zc2tzt]
    paths: ["frontend/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build static export
        env:
          NEXT_PUBLIC_DEPLOY_TARGET: github-pages
          # Set these as repository variables/secrets (Settings -> Secrets
          # and variables -> Actions) once /backend and Vapi are live.
          # Falls back to a placeholder so the build doesn't fail before
          # then — the site still renders, just without a working
          # waitlist submit or voice demo until these are set for real.
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL || 'https://api.example.com' }}
          NEXT_PUBLIC_VAPI_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPI_PUBLIC_KEY }}
          NEXT_PUBLIC_VAPI_ASSISTANT_ID_DEMO: ${{ vars.NEXT_PUBLIC_VAPI_ASSISTANT_ID_DEMO }}
        run: npm run build

      # GitHub Pages runs output through Jekyll by default, which ignores
      # any folder starting with an underscore — including Next.js's
      # _next/ asset directory. This opts out.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
